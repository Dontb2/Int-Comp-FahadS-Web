<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 4 | Logo</title>
    <link rel="icon" type="image/png" href="fslogo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 20px;
            background: #eef7ee;
            color: #13261a;
            text-align: center;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 22px;
            color: #2a8a1c;
            border: 2px solid #2a8a1c;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
        }
        .back:hover {
            background: #2a8a1c;
            color: #fff;
        }

        h1 {
            margin-bottom: 6px;
            color: #2a8a1c;
        }
        p {
            margin-bottom: 20px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: min(100%, 320px);
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
            border: 4px solid #2a8a1c;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .2);
        }
        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

<a href="activities.html#folder-intro-computer" class="back">&larr; Back to Activities</a>

<h1>Activity 4: Logo</h1>
<p>My logo, inserted with the HTML image tag.</p>

<div class="logo-box">
    <img src="fslogo.png" alt="My logo">
</div>

</body>
</html>
