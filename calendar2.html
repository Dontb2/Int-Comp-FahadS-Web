<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 2 | Introduction to Computer</title>
    <link rel="icon" type="image/png" href="../../fslogo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 20px;
            background: #eef7ee;
            color: #13261a;
            text-align: center;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 22px;
            color: #2a8a1c;
            border: 2px solid #2a8a1c;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
        }
        .back:hover {
            background: #2a8a1c;
            color: #fff;
        }

        h1 {
            margin-bottom: 6px;
            color: #2a8a1c;
        }

        .subtitle {
            margin-bottom: 24px;
        }

        /* Dalawang calendar na magkatabi; sa phone ay magkapatong */
        .calendars {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
        }

        table {
            width: 100%;
            max-width: 340px;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .15);
        }

        caption {
            padding: 12px;
            background: #2a8a1c;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
        }

        th, td {
            width: 14.28%;
            padding: 10px 4px;
            border: 1px solid #b5d3b5;
            text-align: center;
        }

        th {
            background: #d6ecd6;
        }

        /* Sunday = pula */
        th:first-child,
        td:first-child {
            color: #c0392b;
        }

        td:hover {
            background: #eaf7ea;
        }

        .today {
            background: #2a8a1c;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

<a href="activities.html#folder-intro-computer" class="back">&larr; Back to Activities</a>

</body>
</html>
