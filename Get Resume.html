<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Get Resume</title>
        <style>
            h2 {
                border-style: double;
                text-align: center;
                margin-left: 70px;
                margin-right: 70px;
            }

            div.one {
                text-align: center;
            }

            label {
                width: 190px;
                display: inline-block;
            }

            /* ===== Dagdag lang: Back button at auto-fit sa phone/tablet ===== */
            * {
                box-sizing: border-box;
            }

            body {
                overflow-x: hidden;
            }

            .back-btn {
                display: inline-block;
                padding: 10px 22px;
                background: #0b6e99;
                color: #fff;
                border: 2px solid #0b6e99;
                border-radius: 8px;
                font-family: Arial, sans-serif;
                font-size: 15px;
                font-weight: bold;
                text-decoration: none;
            }
            .back-btn:hover {
                background: #fff;
                color: #0b6e99;
            }

            input[type="text"],
            select {
                max-width: 100%;
            }

            @media (max-width: 800px) {
                h2 {
                    margin-left: 10px;
                    margin-right: 10px;
                }
            }

            @media (max-width: 600px) {
                label {
                    display: block;
                    width: 100%;
                    margin-bottom: 4px;
                }
                input[type="text"] {
                    width: 100%;
                    max-width: 340px;
                }
            }
        </style>
    </head>

    <body bgcolor="cyan">

    <a href="index.html#home" class="back-btn">&larr; Back to Home</a>

</html>
